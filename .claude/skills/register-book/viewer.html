<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>register-book 기록</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f7f7f5; --panel: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e4df;
  --accent: #2f5bd3; --ok: #1f7a3d; --skip: #6b6b66; --up: #7a4fc4; --fail: #b3261e; --dry: #a86b00;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161615; --panel: #1f1f1d; --text: #ecece8; --muted: #9a9a93; --line: #33332f;
          --accent: #7d9cf0; --ok: #5cc27f; --skip: #9a9a93; --up: #b394ea; --fail: #f08a82; --dry: #e0aa45; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
a { color: var(--accent); text-decoration: none; word-break: break-all; }
a:hover { text-decoration: underline; }
.layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100vh; }
nav { border-right: 1px solid var(--line); padding: 16px; position: sticky; top: 0; height: 100vh; overflow: auto; }
nav h1 { font-size: 15px; margin: 0 0 12px; }
nav h2 { font-size: 12px; color: var(--muted); margin: 16px 0 6px; font-weight: 600; }
.run { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: none; color: inherit;
       padding: 8px; border-radius: 6px; cursor: pointer; font: inherit; }
.run:hover { background: var(--panel); }
.run.active { background: var(--panel); border-color: var(--line); }
.run small { color: var(--muted); display: block; }
main { padding: 24px; max-width: 1100px; }
.head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; margin-bottom: 8px; }
.head h2 { margin: 0; font-size: 22px; }
.meta { color: var(--muted); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 20px; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
         border: 1px solid currentColor; white-space: nowrap; }
.s-created { color: var(--ok); } .s-skipped { color: var(--skip); } .s-cover-upgraded { color: var(--up); }
.s-failed { color: var(--fail); } .s-would-create, .s-would-upgrade-cover, .s-dry { color: var(--dry); }
.card { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 16px; background: var(--panel);
        border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
.cover img { width: 140px; border-radius: 4px; border: 1px solid var(--line); display: block; background: var(--bg); }
.cover .nocover { width: 140px; height: 200px; border: 1px dashed var(--line); border-radius: 4px;
                  display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; }
.cover small { color: var(--muted); display: block; margin-top: 4px; font-size: 12px; }
.title { font-size: 17px; font-weight: 600; margin: 0 0 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.kind { color: var(--muted); font-size: 12px; font-weight: 400; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 8px 0; font-size: 13px; }
dt { color: var(--muted); }
dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.note { background: var(--bg); border-left: 3px solid var(--dry); padding: 6px 10px; margin: 8px 0; font-size: 13px; }
.reason { color: var(--muted); font-size: 13px; }
details { margin-top: 8px; font-size: 13px; }
summary { cursor: pointer; color: var(--muted); }
.srcs { margin: 6px 0 0; padding: 0; list-style: none; }
.srcs li { margin: 2px 0; }
.srcs b { font-weight: 600; color: var(--muted); margin-right: 6px; }
.others { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
.others figure { margin: 0; width: 100px; font-size: 12px; color: var(--muted); }
.others img { width: 100px; border-radius: 4px; border: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line);
        border-radius: 8px; overflow: hidden; font-size: 13px; margin-bottom: 20px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; }
h3 { font-size: 15px; margin: 24px 0 8px; }
.empty { color: var(--muted); padding: 40px 0; }
@media (max-width: 760px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  nav { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  main { padding: 16px; }
  .card { grid-template-columns: 96px minmax(0, 1fr); }
  .cover img, .cover .nocover { width: 96px; }
  .cover .nocover { height: 140px; }
  table { display: block; overflow-x: auto; }
}
</style>
</head>
<body>
<div class="layout">
  <nav><h1>register-book 기록</h1><div id="runs">불러오는 중…</div></nav>
  <main id="main"><div class="empty">왼쪽에서 실행 기록을 고르세요.</div></main>
</div>
<script>
const LANG = { ko: "한국어", en: "영어", de: "독일어", fr: "프랑스어", es: "스페인어", pl: "폴란드어", pt: "포르투갈어",
  ja: "일본어", ca: "카탈루냐어", ru: "러시아어", zh: "중국어", tr: "튀르키예어", hu: "헝가리어", nl: "네덜란드어",
  bg: "불가리아어", cs: "체코어", gl: "갈리시아어", ro: "루마니아어", it: "이탈리아어", sv: "스웨덴어" };
const STATUS = { created: "등록", skipped: "건너뜀", "cover-upgraded": "표지 교체", failed: "실패",
  "would-create": "등록 예정", "would-upgrade-cover": "표지 교체 예정" };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const lang = c => c ? `${esc(LANG[c] || c)} <span class="kind">${esc(c)}</span>` : "";
const badge = s => `<span class="badge s-${esc(s)}">${esc(STATUS[s] || s)}</span>`;
const urlOf = c => typeof c === "string" ? c : c?.url;
// plan은 웹에서 모은 데이터라 href/src에는 http(s) URL만 넣는다 (javascript: 등 차단)
const safeUrl = u => /^https?:\/\//i.test(String(u ?? "")) ? String(u) : "";
// 출처 값은 "URL" 또는 "URL (설명)" 형식
const link = s => { const m = String(s).match(/^(https?:\/\/\S+)(.*)$/);
  return m ? `<a href="${esc(m[1])}" target="_blank" rel="noopener">${esc(m[1])}</a>${esc(m[2])}` : esc(s); };

async function loadRuns() {
  const runs = await (await fetch("/runs")).json();
  const nav = document.getElementById("runs");
  if (!runs.length) { nav.textContent = "기록 없음"; return; }
  const groups = {};
  runs.forEach(r => (groups[r.query || "(제목 없음)"] ||= []).push(r));
  nav.innerHTML = Object.entries(groups).map(([q, rs]) => `<h2>${esc(q)}</h2>` + rs.map(r => `
    <button class="run" data-file="${esc(r.file)}">
      ${esc((r.ranAt || "").replace("T", " "))} ${r.dryRun ? '<span class="badge s-dry">dry-run</span>' : ""}
      <small>${Object.entries(r.summary || {}).map(([k, v]) => `${esc(STATUS[k] || k)} ${v}`).join(" · ")}</small>
    </button>`).join("")).join("");
  nav.querySelectorAll(".run").forEach(b => b.onclick = () => { location.hash = b.dataset.file; });
  window.onhashchange = () => show(decodeURIComponent(location.hash.slice(1)));
  show(decodeURIComponent(location.hash.slice(1)) || runs[0].file);
}

async function show(file) {
  document.querySelectorAll(".run").forEach(b => b.classList.toggle("active", b.dataset.file === file));
  const run = await (await fetch("/runs/" + encodeURIComponent(file))).json();
  const plan = run.plan || {};
  const items = [plan.original, ...(plan.translations || [])];
  const w = plan.work || {};
  document.getElementById("main").innerHTML = `
    <div class="head"><h2>${esc(plan.query)}</h2>${run.dryRun ? '<span class="badge s-dry">dry-run</span>' : ""}</div>
    <div class="meta">${esc((run.ranAt || "").replace("T", " "))} · ${esc(run.apiBase)} · 저자 ${esc(w.author)}
      ${w.wikidata ? ` · <a href="https://www.wikidata.org/wiki/${esc(w.wikidata)}" target="_blank" rel="noopener">${esc(w.wikidata)}</a>` : ""}
      ${w.openlibrary ? ` · <a href="https://openlibrary.org/works/${esc(w.openlibrary)}" target="_blank" rel="noopener">${esc(w.openlibrary)}</a>` : ""}</div>
    <div class="chips">${Object.entries(run.summary || {}).map(([k, v]) => `${badge(k)}<span>${v}</span>`).join(" ")}</div>
    ${(run.results || []).map((r, i) => card(r, items[i] || {})).join("")}
    ${table("검토 필요", plan.review, ["언어", "제목", "ISBN", "사유"], x => [lang(x.languageCode), esc(x.title), esc(x.isbn), esc(x.reason)])}
    ${table("다른 판 (후보)", plan.candidates, ["언어", "제목", "ISBN", "이유"], x => [lang(x.languageCode), esc(x.title), esc(x.isbn), esc(x.why)])}`;
}

function card(r, item) {
  // 서버에 올린 이미지 → 원본 출처 → plan의 후보 순으로 시도
  const imgs = [r.coverUrl, r.coverSourceUrl, ...(item.coverSourceUrls || []).map(urlOf)].map(safeUrl).filter(Boolean);
  const cover = imgs.length
    ? `<img src="${esc(imgs[0])}" data-alt="${esc(JSON.stringify(imgs.slice(1)))}" onerror="nextImg(this)" alt="">`
    : `<div class="nocover">표지 없음</div>`;
  const fields = [["ISBN", r.isbn || item.isbn], ["작가", item.authorName], ["원제", item.originalTitle !== item.title ? item.originalTitle : ""],
    ["옮긴이", item.translatorName], ["출판사", item.publisherName], ["연도", item.year], ["나라", item.countryCode], ["장르", item.genre],
    ["서버 ID", r.id || r.existingId]].filter(([, v]) => v);
  const srcs = Object.entries(item.sources || {});
  const others = (item.otherPrintingCovers || []).filter(o => safeUrl(o.url));
  return `<div class="card">
    <div class="cover">${cover}<small>${esc(r.coverSize || r.to || "")} ${esc(r.coverSourceName || "")}</small></div>
    <div>
      <div class="title">${esc(r.title)} ${badge(r.status)} <span class="kind">${r.kind === "original" ? "원서" : "번역서"} · ${lang(r.languageCode)}</span></div>
      ${r.reason ? `<div class="reason">${esc(r.reason)}</div>` : ""}
      ${r.from ? `<div class="reason">표지 ${esc(r.from)} → ${esc(r.to)}</div>` : ""}
      <dl>${fields.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
      ${item.coverNote ? `<div class="note">표지: ${esc(item.coverNote)}</div>` : ""}
      ${item.notes ? `<div class="note">${esc(item.notes)}</div>` : ""}
      ${srcs.length ? `<details><summary>출처 ${srcs.reduce((n, [, v]) => n + [].concat(v).length, 0)}개</summary><ul class="srcs">
        ${srcs.map(([k, v]) => [].concat(v).map(u => `<li><b>${esc(k)}</b>${link(urlOf(u) || u)}</li>`).join("")).join("")}</ul></details>` : ""}
      ${others.length ? `<details><summary>다른 쇄 표지 ${others.length}개 (등록 안 함)</summary><div class="others">
        ${others.map(o => `<figure><a href="${esc(o.url)}" target="_blank" rel="noopener"><img src="${esc(o.url)}" alt="" loading="lazy"></a>
          ${esc(o.sourceName)} ${esc(o.size)}<br>${esc(o.note)}</figure>`).join("")}</div></details>` : ""}
    </div></div>`;
}

function table(title, rows, head, cells) {
  if (!rows?.length) return "";
  return `<h3>${title} ${rows.length}</h3><table><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr>
    ${rows.map(x => `<tr>${cells(x).map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</table>`;
}

function nextImg(img) {
  const rest = JSON.parse(img.dataset.alt || "[]");
  if (!rest.length) { img.replaceWith(Object.assign(document.createElement("div"), { className: "nocover", textContent: "표지 못 불러옴" })); return; }
  img.dataset.alt = JSON.stringify(rest.slice(1));
  img.src = rest[0];
}

loadRuns().catch(e => { document.getElementById("runs").textContent = "불러오기 실패: " + e; });
</script>
</body>
</html>
