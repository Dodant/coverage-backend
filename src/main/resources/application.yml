spring:
  application:
    name: book-cover-archive
  profiles:
    active: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: 8080
  servlet:
    context-path: /api

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-token-generation-change-in-production}
  expiration: 86400000  # 24 hours in milliseconds
  refresh-expiration: 604800000  # 7 days in milliseconds

# Image Configuration
image:
  min-width: 800
  min-height: 1200
  max-file-size: 10485760  # 10MB in bytes
  allowed-formats:
    - image/jpeg
    - image/png
    - image/webp
  thumbnail:
    width: 300
    height: 450

# Rate Limiting Configuration
rate-limit:
  upload:
    limit: 10
    window-seconds: 3600
  comment:
    limit: 30
    window-seconds: 60
  like:
    limit: 100
    window-seconds: 60
  report:
    limit: 5
    window-seconds: 3600

# Springdoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
