spring:
  application:
    name: book-cover-archive
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /api

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/bookcover_dev
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
    elasticsearch:
      repositories:
        enabled: true
  elasticsearch:
    uris: http://localhost:9200
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: book-cover-archive
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.bookcover.archive.*
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

# JWT Configuration
jwt:
  secret: dev-secret-key-for-jwt-token-generation-minimum-256-bits-long-enough
  expiration: 86400000
  refresh-expiration: 604800000

# Image Storage Configuration
storage:
  type: minio
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: book-covers
  region: us-east-1

# Image Validation
image:
  min-width: 800
  min-height: 1200
  max-file-size: 10485760
  allowed-formats:
    - image/jpeg
    - image/png
    - image/webp
  thumbnail:
    width: 300
    height: 450

# Rate Limiting
rate-limit:
  upload:
    limit: 10
    window-seconds: 3600
  comment:
    limit: 30
    window-seconds: 60
  like:
    limit: 100
    window-seconds: 60
  report:
    limit: 5
    window-seconds: 3600

# Logging
logging:
  level:
    root: INFO
    com.bookcover.archive: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---
# Test Profile
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
    elasticsearch:
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: localhost:9092
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

jwt:
  secret: test-secret-key-for-jwt-token-generation-minimum-256-bits-long-enough
  expiration: 86400000
  refresh-expiration: 604800000

storage:
  type: local
  local-path: /tmp/book-covers-test

image:
  min-width: 800
  min-height: 1200
  max-file-size: 10485760
  allowed-formats:
    - image/jpeg
    - image/png
    - image/webp
  thumbnail:
    width: 300
    height: 450

rate-limit:
  upload:
    limit: 100
    window-seconds: 60
  comment:
    limit: 100
    window-seconds: 60
  like:
    limit: 1000
    window-seconds: 60
  report:
    limit: 100
    window-seconds: 60

logging:
  level:
    root: WARN
    com.bookcover.archive: INFO

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
    elasticsearch:
      repositories:
        enabled: true
  elasticsearch:
    uris: ${ELASTICSEARCH_URI}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: book-cover-archive
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.bookcover.archive.*
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

storage:
  type: s3
  endpoint: ${S3_ENDPOINT:}
  access-key: ${S3_ACCESS_KEY}
  secret-key: ${S3_SECRET_KEY}
  bucket: ${S3_BUCKET}
  region: ${S3_REGION:ap-northeast-2}

image:
  min-width: 800
  min-height: 1200
  max-file-size: 10485760
  allowed-formats:
    - image/jpeg
    - image/png
    - image/webp
  thumbnail:
    width: 300
    height: 450

rate-limit:
  upload:
    limit: ${RATE_LIMIT_UPLOAD:10}
    window-seconds: ${RATE_LIMIT_UPLOAD_WINDOW:3600}
  comment:
    limit: ${RATE_LIMIT_COMMENT:30}
    window-seconds: ${RATE_LIMIT_COMMENT_WINDOW:60}
  like:
    limit: ${RATE_LIMIT_LIKE:100}
    window-seconds: ${RATE_LIMIT_LIKE_WINDOW:60}
  report:
    limit: ${RATE_LIMIT_REPORT:5}
    window-seconds: ${RATE_LIMIT_REPORT_WINDOW:3600}

logging:
  level:
    root: WARN
    com.bookcover.archive: INFO
