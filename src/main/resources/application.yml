spring:
  application:
    name: book-cover-archive
  profiles:
    active: dev

  jpa:
    # controllers map entities to DTOs after the service tx ends; needs the session kept open
    # ponytail: OSIV holds a DB connection per request; move mapping into services if pool pressure shows up
    open-in-view: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # 지연 로딩 컬렉션·연관(표지 크레딧, 디자이너, 표지)을 IN 쿼리로 묶어 목록 API의 N+1을 줄인다
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: 8080
  servlet:
    context-path: /api

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-token-generation-change-in-production}
  expiration: 86400000  # 24 hours in milliseconds
  refresh-expiration: 604800000  # 7 days in milliseconds

# Image Configuration
image:
  min-width: 800
  min-height: 1200
  max-file-size: 10485760  # 10MB in bytes
  allowed-formats:
    - image/jpeg
    - image/png
    - image/webp
  thumbnail:
    width: 300
    height: 450
  # 최소 해상도 검사를 건너뛸 사용자 ID(쉼표 구분). 공개 API 표지(~500px)를 올리는 에이전트 전용 계정용
  resolution-exempt-user-ids: ${IMAGE_RESOLUTION_EXEMPT_USER_IDS:}

# Rate Limiting Configuration
rate-limit:
  upload:
    limit: 10
    window-seconds: 3600
  comment:
    limit: 30
    window-seconds: 60
  like:
    limit: 100
    window-seconds: 60
  report:
    limit: 5
    window-seconds: 3600
  takedown:
    limit: 5
    window-seconds: 3600
  # 한도를 적용하지 않을 사용자 ID(쉼표 구분). 서지 자동 등록 에이전트 전용 계정용
  exempt-user-ids: ${RATE_LIMIT_EXEMPT_USER_IDS:}

# Springdoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    filter: true
    show-extensions: true
    show-common-extensions: true
    doc-expansion: none
    default-models-expand-depth: 3
    default-model-expand-depth: 3
  show-actuator: false
  packages-to-scan: com.bookcover.archive.controller
  paths-to-match: /**
