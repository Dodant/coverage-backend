spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
    elasticsearch:
      repositories:
        enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

jwt:
  secret: test-secret-key-for-jwt-token-generation-minimum-256-bits-long-enough
  expiration: 86400000
  refresh-expiration: 604800000

storage:
  type: local
  local-path: /tmp/book-covers-test

image:
  min-width: 800
  min-height: 1200
  max-file-size: 10485760
  allowed-formats:
    - image/jpeg
    - image/png
    - image/webp
  thumbnail:
    width: 300
    height: 450

rate-limit:
  upload:
    limit: 100
    window-seconds: 60
  comment:
    limit: 100
    window-seconds: 60
  like:
    limit: 1000
    window-seconds: 60
  report:
    limit: 100
    window-seconds: 60

logging:
  level:
    root: WARN
    com.bookcover.archive: DEBUG
